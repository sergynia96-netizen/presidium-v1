global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "presidium-relay"
    static_configs:
      - targets: ["relay:3001"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "presidium-webapp"
    static_configs:
      - targets: ["webapp:3000"]
    metrics_path: /metrics
    scrape_interval: 10s
