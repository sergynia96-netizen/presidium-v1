# Coturn TURN/STUN server configuration

# ── Listener ───────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# ── Relay ──────────────────────────────────────────────────
relay-ip=${COTURN_EXTERNAL_IP}
min-port=49152
max-port=65535

# ── Realm & Auth ───────────────────────────────────────────
realm=${COTURN_REALM}
server-name=presidium.turn

# Use long-term credentials from env
user=${COTURN_USER}:${COTURN_PASSWORD}

# ── TLS (uncomment when certificates are available) ────────
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# no-tlsv1
# no-tlsv1_1

# ── Security ───────────────────────────────────────────────
fingerprint
lt-cred-mech
no-multicast-peers
no-cli
stale-nonce=600

# ── Logging ────────────────────────────────────────────────
log-file=stdout
verbose

# ── Performance ────────────────────────────────────────────
total-quota=100
bps-capacity=0
max-bps=0
