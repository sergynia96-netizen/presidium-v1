[package]
name = "presidium-desktop"
version = "2.6.0"
description = "Presidium Desktop Client — Sovereign Messenger"
authors = ["Карнаух Сергей Сергеевич <sergynia96-netizen@presidium.app>"]
license = "MIT"
repository = "https://github.com/sergynia96-netizen/presidium-v1"
edition = "2021"

[lib]
name = "presidium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
crypto_box = { version = "0.9", features = ["std", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
dirs = "5"
base64 = "0.22"
thiserror = "1"
log = "0.4"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
