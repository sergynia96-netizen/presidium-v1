syntax = "proto3";

package presidium.core;

option go_package = "./core";

enum NodePowerStatus {
  UNKNOWN = 0;
  PLUGGED = 1;
  BATTERY_HIGH = 2;
  BATTERY_LOW = 3;
}

message NodeInfo {
  bytes peer_id = 1;
  string version = 2;
  bool is_background_active = 3;
  NodePowerStatus power = 4;
}

message ConnectionEvent {
  string event_id = 1;
  bytes from_peer = 2;
  bytes to_peer = 3;
  uint64 timestamp = 4;
}